<!doctype html><meta charset="utf-8"><title>GitHub upload bridge</title><style>body{font:16px system-ui;background:#111;color:#eee;max-width:720px;margin:40px auto}input,button{display:block;margin:12px 0;padding:12px;width:100%}pre{white-space:pre-wrap}</style><h1>GitHub upload bridge</h1><input id="token" type="password" placeholder="Fine-scoped token"><label>Vargmyra<input id="v" type="file"></label><label>Ljusvik<input id="l" type="file"></label><button id="go">Push both</button><pre id="out">Ready</pre><script>
const o=document.querySelector('#out'),token=document.querySelector('#token');async function req(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token.value,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const tx=await r.text();let j;try{j=JSON.parse(tx)}catch{j={raw:tx}};if(!r.ok)throw Error(JSON.stringify({path,status:r.status,message:j.message,documentation_url:j.documentation_url,xAccepted:r.headers.get('x-accepted-github-permissions'),xOAuth:r.headers.get('x-oauth-scopes')}));return j}async function b64(f){const a=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}async function put(repo,f){let sha;try{sha=(await req('/repos/aeiouvcode/'+repo+'/contents/index.html')).sha}catch{};return req('/repos/aeiouvcode/'+repo+'/contents/index.html',{method:'PUT',body:JSON.stringify({message:'Publish stable '+repo+' build',content:await b64(f),branch:'main',...(sha?{sha}:{})})})}go.onclick=async()=>{try{o.textContent='Uploading Vargmyra';await put('vargmyra',v.files[0]);o.textContent='Uploading Ljusvik';await put('ljusvik',l.files[0]);o.textContent='DONE'}catch(e){o.textContent='ERROR '+e.message}finally{token.value=''}}
</script>
