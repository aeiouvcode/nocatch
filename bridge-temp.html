<!doctype html><meta charset="utf-8"><title>GitHub upload bridge</title><style>body{font:16px system-ui;background:#111;color:#eee;max-width:720px;margin:40px auto}input,button{display:block;margin:12px 0;padding:12px;width:100%}pre{white-space:pre-wrap}</style><h1>GitHub upload bridge</h1><input id="token" type="password" placeholder="Fine-scoped token"><label>Vargmyra index.html<input id="v" type="file" accept="text/html"></label><label>Ljusvik index.html<input id="l" type="file" accept="text/html"></label><button id="go">Push both</button><pre id="out">Ready</pre><script>
const out=document.querySelector('#out');
async function req(path,opt={}){const t=document.querySelector('#token').value;const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(path+' '+r.status+' '+(j.message||''));return j}
async function b64(file){const a=new Uint8Array(await file.arrayBuffer());let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s)}
async function put(repo,file){let sha;try{sha=(await req('/repos/aeiouvcode/'+repo+'/contents/index.html')).sha}catch(e){};return req('/repos/aeiouvcode/'+repo+'/contents/index.html',{method:'PUT',body:JSON.stringify({message:'Publish stable '+repo+' build',content:await b64(file),branch:'main',...(sha?{sha}:{})})})}
document.querySelector('#go').onclick=async()=>{try{out.textContent='Uploading Vargmyra…';await put('vargmyra',document.querySelector('#v').files[0]);out.textContent='Uploading Ljusvik…';await put('ljusvik',document.querySelector('#l').files[0]);out.textContent='DONE';}catch(e){out.textContent='ERROR '+e.message}finally{document.querySelector('#token').value=''}}
</script>
